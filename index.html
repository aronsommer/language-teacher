<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale stops iOS Safari from zooming in when a text field gets focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- Safari on iPhone and iPad would link the version as a phone number. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Language Teacher</title>
    <!-- Before the first paint, so a stored theme does not flash. -->
    <script>
      document.documentElement.style.colorScheme =
        localStorage.getItem("language-teacher:theme") ?? "";
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=dark_mode,fullscreen,fullscreen_exit,light_mode,mic,mic_off,settings&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=__BUILD_TIMESTAMP__" />
    <!-- The SDK app.js imports, fetched from the start rather than once app.js has loaded. -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@google/genai@2.27.0/+esm" />
    <script type="module" src="app.js?v=__BUILD_TIMESTAMP__"></script>
  </head>
  <body>
    <header>
      <h1><span aria-hidden="true">👩‍🏫</span>Language Teacher</h1>
      <div class="corner">
        <button id="openSettings" class="material-symbols-outlined" aria-label="Settings">
          settings
        </button>
        <button id="theme" class="material-symbols-outlined" aria-label="Theme">dark_mode</button>
        <button id="fullscreen" class="material-symbols-outlined" aria-label="Fullscreen">
          fullscreen
        </button>
      </div>
      <div class="buttons">
        <button id="toggle"><span>Start</span><span>Stop</span></button>
        <button id="clear" class="plain">Clear</button>
        <div class="checks">
          <label>
            <input id="translationMode" type="checkbox" />
            Translation
          </label>
          <label>
            <input id="wordMode" type="checkbox" />
            Word by word
          </label>
        </div>
      </div>
      <p id="status"></p>
    </header>
    <main>
      <div id="intro">
        <p id="hint"></p>
        <button id="addKey" class="bad">Add Gemini API key</button>
      </div>
      <div id="log"></div>
    </main>
    <footer id="said"></footer>
    <dialog id="settings">
      <form method="dialog">
        <h2>Settings</h2>
        <label>
          I learn
          <select id="learnLanguage"></select>
        </label>
        <label>
          I speak
          <select id="nativeLanguage"></select>
        </label>
        <label>
          <span>
            Gemini API key
            <a href="https://aistudio.google.com/api-keys" target="_blank" rel="noopener"
              >Get a free key</a
            >
          </span>
          <input
            id="key"
            type="text"
            placeholder=" "
            autocomplete="off"
            spellcheck="false"
            data-bwignore
            data-1p-ignore
            data-lpignore="true"
          />
        </label>
        <label>
          Notes for the teacher
          <textarea
            id="notes"
            placeholder="What she should know or do, e.g. “I already know greetings. Speak slowly.”"
          ></textarea>
        </label>
        <!-- The deploy workflow replaces the version with the UTC time of the deploy. -->
        <p>
          <a href="https://github.com/aronsommer/language-teacher" target="_blank" rel="noopener"
            >Open Source</a
          >
          Version __BUILD_TIMESTAMP__
        </p>
        <button class="plain">Done</button>
      </form>
    </dialog>
  </body>
</html>
